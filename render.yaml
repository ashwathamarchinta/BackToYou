services:
  - type: web
    name: backtoyou-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: backtoyou-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: backtoyou-db
    databaseName: lostfound
    user: backtoyou_user
    plan: free
